<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <header>
        <h1>Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Quiz Questions</legend>

                <div class="form-item">
                    <label for="q1"><span class="q-num">1.</span>What does the acronym CSS stands for?</label>
                    <input type="text" id="q1" name="q1" required>
                </div>

                <div class="form-item">
                <label for="q2"><span class="q-num">2.</span> How are id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
                </div>

                <div class="form-item">
                    <label for="q3"><span class="q-num">3.</span>What does HTML stand for?</label>
                    <select id="q3" name="q3" required>
                        <option value="" selected disabled>Choose One...</option>
                        <option value="hyper_text">HyperText  Markup Language</option>
                        <option value="home_tool">Home Tool Markup Language</option>
                        <option value="hyperlinks">Hyperlinks and Text Markup Language</option>
                        <option value="hypertext_makeup">Hypertext Makeup Language</option>
                    </select>
                </div>

            <div class="form-item">
                <label for="q4"><span class="q-num">4.</span>What is the bottom margin given this  declaration?</label>
                <code class="code-box">margin: 10px 5px 15px</code>
                <input type="number" id="q4" name="q4" required>
            </div>
        </fieldset>

        <button type="submit">Submit Quiz</button>
    </form>
    </main>
    <footer>
        <p>&copy;2026 \ Code-Along Activity: Quiz Form | Anabelle Andaya</p>
    </footer>
</body>
</html>
